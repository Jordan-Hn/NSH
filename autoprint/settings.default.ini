; AutoPrint default settings. This file is replaced by updates, so DON'T put
; this PC's printers here. Run Setup.cmd instead: it saves your printers in
; settings.ini, which updates never touch.

; Printer for labels (pages smaller than LabelMaxPts)
LabelPrinter = ZDesigner GK420d

; Printer for full pages: invoices, packing slips, picking tickets
PagePrinter = Door 1

; A page whose longest side is under this many points is a label (A4 = 842, 4x6" label = 432)
LabelMaxPts = 700

; Labels containing this word print PalletCopies times
PalletPattern = (?i)\bPallet\b
PalletCopies = 2

; How often to check the folder, in seconds
PollSeconds = 1

; Folder to watch. Blank = Downloads\AutoPrint (what NetSuite Helper saves to)
WatchFolder =

; Automatic updates: the GitHub repo NetSuite Helper updates itself from (owner/name,
; e.g. Jordan-Hn/reponame).
; Checked every UpdateMinutes. Blank = no automatic updates.
UpdateRepo = Jordan-Hn/NSH
UpdateMinutes = 15
