<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NetSuite Helper Settings</title>
<style>
  body { margin: 0; background: #f0f0f0; font: 13px "Open Sans", Helvetica, Arial, sans-serif; color: #333; }
  header { background: #607799; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; }
  main { max-width: 860px; margin: 18px auto 60px; padding: 0 16px; }
  section { background: #fff; border-radius: 5px; box-shadow: 0 0 8px rgba(195, 195, 195, .5); margin-bottom: 16px; }
  h2 { margin: 0; background: #dfe4ec; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 5px 5px 0 0; }
  .rows { padding: 6px 14px 12px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .row:last-child { border-bottom: 0; }
  .row label.name { flex: 0 0 280px; font-weight: 600; }
  .row .ctl { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type=text], input[type=number] { font: inherit; padding: 3px 6px; border: 1px solid #b5b5b5; border-radius: 2px; background: #fff; }
  input[type=number] { width: 60px; }
  table.list { border-collapse: collapse; }
  table.list td { padding: 3px 6px 3px 0; }
  button { font: inherit; border: 1px solid #b5b5b5; background: #e9e9e9; border-radius: 3px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: #1a6ff0; border-color: #1a6ff0; color: #fff; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 20px; }
  .note { color: #666; font-size: 12px; }
  #saved { position: fixed; right: 20px; bottom: 20px; background: #1b7f3b; color: #fff; padding: 8px 14px; border-radius: 4px; display: none; }
  #ap-status { color: #666; }
</style>
</head>
<body>
<header>NetSuite Helper Settings</header>
<main>
  <section>
    <h2>Ship Orders</h2>
    <div class="rows">
      <div class="row"><label class="name">Paperwork by customer</label>
        <div class="ctl" style="display:block">
          <table class="list" id="paperwork"></table>
          <button type="button" id="paperwork-add">Add customer</button>
        </div></div>
      <div class="row"><label class="name" for="toMethod">Store orders (TOs): default method</label><div class="ctl"><select id="toMethod" data-key="toMethod" class="method"></select></div></div>
      <div class="row"><label class="name" for="toSlips">Store orders: print the packing slip</label><div class="ctl"><input type="checkbox" id="toSlips" data-key="toSlips"></div></div>
      <div class="row"><label class="name" for="workers">Orders at once</label><div class="ctl"><select id="workers" data-key="workers" data-num="1"><option>1</option><option>2</option><option>3</option></select></div></div>
      <div class="row"><label class="name" for="autoRetry">Try a failed save again by itself</label><div class="ctl"><input type="checkbox" id="autoRetry" data-key="autoRetry"></div></div>
      <div class="row"><label class="name" for="shipAutoPrint">Send paperwork to AutoPrint</label><div class="ctl"><input type="checkbox" id="shipAutoPrint" data-key="shipAutoPrint"></div></div>
      <div class="row"><label class="name">Method for each courier</label>
        <div class="ctl grid2" id="courier-methods"></div></div>
    </div>
  </section>

  <section>
    <h2>Bulk Waves and picking tickets</h2>
    <div class="rows">
      <div class="row"><label class="name" for="waveHelpers">Extra helpers for Bulk Waves</label><div class="ctl"><select id="waveHelpers" data-key="waveHelpers"><option value="auto">By list size</option><option value="0">None</option><option value="1">1</option><option value="2">2</option></select></div></div>
      <div class="row"><label class="name" for="wavesAutoPrint">Send tickets to AutoPrint when the waves are done</label><div class="ctl"><input type="checkbox" id="wavesAutoPrint" data-key="wavesAutoPrint"></div></div>
      <div class="row"><label class="name">Stamp on the tickets</label><div class="ctl">
        <label><input type="checkbox" data-key="stampWave"> Wave</label>
        <label><input type="checkbox" data-key="stampCode"> Code (state, ST, FW, PU, 1/5)</label>
        <label><input type="checkbox" data-key="stampDel"> Delivery date</label></div></div>
      <div class="row"><label class="name" for="delFormat">Delivery date format</label><div class="ctl"><select id="delFormat" data-key="delFormat"><option value="d/m">2/12</option><option value="dd/mm">02/12</option><option value="d/m/yy">2/12/26</option></select></div></div>
    </div>
  </section>

  <section>
    <h2>Pending Orders page</h2>
    <div class="rows">
      <div class="row"><label class="name" for="pendingView">View</label><div class="ctl"><select id="pendingView" data-key="pendingView"><option value="normal">Normal</option><option value="large">Large rows</option><option value="tiles">Tiles</option></select></div></div>
      <div class="row"><label class="name" for="stockLabel">Stock shows</label><div class="ctl"><select id="stockLabel" data-key="stockLabel"><option value="both">Code + name</option><option value="code">Code</option><option value="name">Name</option></select></div></div>
      <div class="row"><label class="name" for="overdueGrace">Overdue means the ship date is</label><div class="ctl"><select id="overdueGrace" data-key="overdueGrace" data-num="1"><option value="0">Before today</option><option value="1">More than 1 day ago</option><option value="2">More than 2 days ago</option></select></div></div>
      <div class="row"><label class="name" for="samplesSection">Samples orders in their own section</label><div class="ctl"><input type="checkbox" id="samplesSection" data-key="samplesSection"></div></div>
      <div class="row"><label class="name">Row colours</label><div class="ctl">
        <label>Stripe <input type="color" data-key="stripeColour"></label>
        <label>Overdue <input type="color" data-key="overdueColour"></label></div></div>
    </div>
  </section>

  <section>
    <h2>Auto Print</h2>
    <div class="rows">
      <div class="row"><label class="name" for="labelPrinter">Label printer</label><div class="ctl"><select id="labelPrinter"></select></div></div>
      <div class="row"><label class="name" for="pagePrinter">Page printer (invoices, slips, tickets)</label><div class="ctl"><select id="pagePrinter"></select></div></div>
      <div class="row"><label class="name">Copies</label><div class="ctl">
        <label>Labels <input type="number" id="labelCopies" min="1" max="9"></label>
        <label>Pallet labels <input type="number" id="palletCopies" min="1" max="9"></label>
        <label>Invoices <input type="number" id="invoiceCopies" min="1" max="9"></label>
        <label>Other pages <input type="number" id="pageCopies" min="1" max="9"></label></div></div>
      <div class="row"><label class="name"></label><div class="ctl"><button type="button" class="primary" id="ap-save">Save printers</button><span id="ap-status"></span></div></div>
      <div class="row"><label class="name" for="connote">Connote on invoices</label><div class="ctl"><input type="checkbox" id="connote" data-key="connote"></div></div>
      <div class="row"><label class="name" for="tidy">Tidy packing slips and picking tickets</label><div class="ctl"><input type="checkbox" id="tidy" data-key="tidy"></div></div>
    </div>
  </section>

  <section>
    <h2>Tools</h2>
    <div class="rows">
      <div class="row"><label class="name">Turned on</label><div class="ctl grid2" id="tools"></div></div>
      <div class="row"><label class="name" for="copyAll">Click any field on a record to copy it</label><div class="ctl"><input type="checkbox" id="copyAll" data-key="copyAll"></div></div>
    </div>
  </section>
  <p class="note">Changes save straight away and apply to this computer only. Refresh open NetSuite tabs to see them.</p>
</main>
<div id="saved">Saved</div>
<script src="settings.js"></script>
</body>
</html>
